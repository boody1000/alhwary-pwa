<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a1628">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="avatar.png">
<link rel="apple-touch-icon" href="avatar.png">
<title>Alhwary AI</title>
<style>
:root{
    --navy-950:#0a1628;
    --navy-900:#0d1b2e;
    --navy-800:#132741;
    --navy-700:#1a3355;
    --gold:#d4af37;
    --gold-light:#e6c667;
    --gold-soft:#f4ead3;
    --green:#1f5b4b;
    --green-dark:#16483b;
    --green-light:#2e8b6d;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

html,body{
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
}

body{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at 12% 8%, rgba(212,175,55,.14), transparent 28%),
        radial-gradient(circle at 88% 18%, rgba(31,91,75,.12), transparent 30%),
        radial-gradient(circle at 50% 90%, rgba(212,175,55,.08), transparent 40%),
        linear-gradient(135deg, #0a1628 0%, #0d1b2e 50%, #0a1628 100%);
    position:relative;
}
body::before{
    content:'';position:fixed;inset:0;
    background:
        radial-gradient(circle at 20% 30%, rgba(212,175,55,.08) 0%, transparent 25%),
        radial-gradient(circle at 80% 70%, rgba(46,139,109,.06) 0%, transparent 25%);
    pointer-events:none;z-index:0;
}

.top-header{
    position:fixed;top:0;left:0;right:0;height:64px;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;gap:10px;
    background:linear-gradient(180deg, rgba(10,22,40,.95), rgba(10,22,40,.7));
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(212,175,55,.15);
}
.hw-logo{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.hw-logo svg{width:34px;height:40px;display:block;}
.hw-logo-text{
    color:var(--gold);font-weight:800;font-size:16px;
    letter-spacing:1px;white-space:nowrap;
    font-family:'Segoe UI',Tahoma,sans-serif;
}

.top-badge{
    background:linear-gradient(135deg, var(--green), var(--green-dark));
    color:#fff;font-size:11px;font-weight:700;
    padding:6px 12px;border-radius:20px;
    border:1px solid rgba(212,175,55,.35);
    box-shadow:0 2px 10px rgba(0,0,0,.3);
    white-space:nowrap;
    flex-shrink:1;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:220px;
}

.top-actions{
    display:flex;align-items:center;gap:8px;flex-shrink:0;
}

.model-selector{
    background:rgba(19,39,65,.7);border:1px solid rgba(212,175,55,.3);
    padding:6px 10px;border-radius:10px;font-size:12px;
    color:var(--gold-light);cursor:pointer;font-family:inherit;
    outline:none;
    -webkit-appearance:none;
    appearance:none;
}
.model-selector option{background:var(--navy-900);color:#fff;}

.main-container{
    position:relative;z-index:10;
    height:100vh;
    height:100dvh;
    display:flex;flex-direction:column;
    justify-content:space-between;align-items:center;
    padding:78px 16px 16px;
}

.chat-messages-container{
    flex:1;width:100%;max-width:900px;
    overflow-y:auto;padding:8px;
    display:flex;flex-direction:column;gap:14px;
    background:transparent;
    scrollbar-width:thin;scrollbar-color:rgba(212,175,55,.4) transparent;
    -webkit-overflow-scrolling:touch;
}
.chat-messages-container::-webkit-scrollbar{width:6px;}
.chat-messages-container::-webkit-scrollbar-thumb{background:rgba(212,175,55,.4);border-radius:3px;}

.welcome-center{text-align:center;max-width:680px;width:100%;margin:auto;padding:16px;}
h1{
    font-size:42px;
    background:linear-gradient(90deg, #e6c667, #d4af37, #b8932b, #e6c667);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;
    margin-bottom:14px;font-weight:800;
    text-shadow:0 0 30px rgba(212,175,55,.15);
    line-height:1.3;
    font-family:'Segoe UI',Tahoma,sans-serif;
    letter-spacing:.5px;
}
.welcome-sub{color:rgba(255,255,255,.85);line-height:1.8;font-size:15px;}

.input-box-wrapper{
    width:100%;max-width:800px;
    background:rgba(10,22,40,.85);
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
    border-radius:24px;padding:8px 12px;
    display:flex;flex-direction:column;gap:10px;
    border:1px solid rgba(212,175,55,.25);
    transition:all .3s;
    box-shadow:0 8px 32px rgba(0,0,0,.4);
    margin-bottom:env(safe-area-inset-bottom, 0);
}
.input-box-wrapper:focus-within{
    border-color:var(--gold);
    box-shadow:0 8px 32px rgba(0,0,0,.4), 0 0 0 3px rgba(212,175,55,.15);
}
.input-main-row{display:flex;align-items:center;gap:8px;}

.input-box-wrapper input[type="text"]{
    flex:1;min-width:0;
    border:none;background:transparent;outline:none;
    font-size:15px;color:#fff;font-family:inherit;
    padding:10px 4px;
    caret-color:var(--gold);
}
.input-box-wrapper input[type="text"]::placeholder{color:rgba(255,255,255,.45);}

.input-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}

.action-icon-btn{
    background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.25);
    cursor:pointer;color:var(--gold-light);
    display:flex;align-items:center;justify-content:center;
    padding:10px;border-radius:50%;transition:all .25s;
    text-decoration:none;
    flex-shrink:0;
    min-width:40px;min-height:40px;
}
.action-icon-btn:hover{
    background:rgba(212,175,55,.2);
    border-color:var(--gold);
    color:var(--gold);
    transform:translateY(-1px);
}
.action-icon-btn:active{
    transform:scale(.95);
}

#send-btn{
    background:linear-gradient(135deg, var(--green), var(--green-light));
    border:1px solid var(--gold);
    color:#fff;
}
#send-btn:hover{
    background:linear-gradient(135deg, var(--green-light), var(--green));
    box-shadow:0 0 20px rgba(46,139,109,.6);
}

#voice-btn{
    background:linear-gradient(135deg, var(--gold), var(--gold-light));
    border:1px solid rgba(255,255,255,.25);
    color:var(--navy-950);
    box-shadow:0 4px 12px rgba(212,175,55,.4);
}
#voice-btn:hover{
    background:linear-gradient(135deg, var(--gold-light), var(--gold));
    box-shadow:0 6px 20px rgba(212,175,55,.7);
    color:var(--navy-950);
    transform:translateY(-2px);
}

.chat-row{display:flex;width:100%;}
.chat-user{justify-content:flex-start;}
.chat-bot{justify-content:flex-end;}

.chat-bubble{
    max-width:78%;padding:12px 16px;border-radius:18px;
    line-height:1.75;font-size:15px;word-wrap:break-word;
    white-space:pre-wrap;text-align:right;
    animation:hwChatFade .25s ease-out;
    word-break:break-word;
    color:#fff;
}
@keyframes hwChatFade{
    from{opacity:0;transform:translateY(4px);}
    to{opacity:1;transform:translateY(0);}
}

.chat-user .chat-bubble{
    background:rgba(10,22,40,.85);
    color:#fff;
    font-weight:500;
    border:1px solid rgba(212,175,55,.5);
    border-radius:18px 18px 4px 18px;
    box-shadow:0 4px 12px rgba(0,0,0,.35);
}

.chat-bot .chat-bubble{
    background:rgba(10,22,40,.85);
    color:#fff;
    border:1px solid rgba(46,139,109,.5);
    border-radius:18px 18px 18px 4px;
    box-shadow:0 4px 12px rgba(0,0,0,.35);
}

.chat-bubble.thinking{color:var(--gold-light);font-style:italic;}
.chat-bubble.thinking::after{
    content:' ●●●';letter-spacing:2px;display:inline-block;
    animation:hwChatDots 1.4s linear infinite;
}
@keyframes hwChatDots{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-3px);}
}

#login-overlay{
    position:fixed;inset:0;z-index:99999;
    display:flex;align-items:center;justify-content:center;
    padding:16px;
    background:
        radial-gradient(circle at 50% 40%, rgba(212,175,55,.12), transparent 40%),
        linear-gradient(135deg, #0a1628 0%, #0d1b2e 50%, #0a1628 100%);
    transition:opacity .4s ease, visibility .4s ease;
    overflow-y:auto;
}
#login-overlay.hidden{opacity:0;visibility:hidden;pointer-events:none;}

.login-card{
    background:linear-gradient(160deg, rgba(19,39,65,.95), rgba(13,27,46,.98));
    border:1px solid rgba(212,175,55,.35);
    border-radius:24px;padding:40px 32px;
    text-align:center;width:min(100%, 420px);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    box-shadow:
        0 24px 60px rgba(0,0,0,.6),
        0 0 0 1px rgba(212,175,55,.15),
        inset 0 1px 0 rgba(255,255,255,.05);
    position:relative;
    margin:auto;
}
.login-card::before{
    content:'';position:absolute;inset:-1px;border-radius:24px;
    background:linear-gradient(135deg, rgba(212,175,55,.5), transparent 40%, transparent 60%, rgba(212,175,55,.3));
    z-index:-1;filter:blur(8px);
}
.login-logo{margin:0 auto 16px;display:block;width:70px;height:82px;}
.login-title{
    color:var(--gold);font-size:22px;font-weight:800;margin-bottom:6px;
    font-family:'Segoe UI',Tahoma,sans-serif;
    letter-spacing:1px;
}
.login-sub{
    color:rgba(255,255,255,.7);font-size:13px;line-height:1.7;margin-bottom:28px;
}

.google-btn{
    display:flex;align-items:center;justify-content:center;gap:12px;
    width:100%;padding:14px 20px;border-radius:14px;
    background:#fff;color:#1f1f1f;border:1px solid #dadce0;
    font-family:inherit;font-size:15px;font-weight:700;
    cursor:pointer;transition:all .25s;
    box-shadow:0 4px 12px rgba(0,0,0,.25);
    -webkit-tap-highlight-color:transparent;
}
.google-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 24px rgba(0,0,0,.35), 0 0 0 3px rgba(212,175,55,.2);
}
.google-btn:active{transform:scale(.98);}
.google-btn svg{width:20px;height:20px;flex-shrink:0;}

.login-note{
    margin-top:22px;font-size:11px;color:rgba(255,255,255,.5);line-height:1.7;
}
.login-note b{color:var(--gold-light);}

.user-chip{
    display:flex;align-items:center;gap:8px;
    background:rgba(19,39,65,.8);
    border:1px solid rgba(212,175,55,.3);
    padding:4px 10px 4px 4px;border-radius:22px;
    font-size:12px;color:#fff;font-weight:600;
    max-width:160px;
}
.user-chip img,
.user-chip .user-avatar{
    width:28px;height:28px;border-radius:50%;
    border:1px solid var(--gold);
    object-fit:cover;
    flex-shrink:0;
}
.user-chip .user-avatar{
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg, var(--gold), var(--gold-light));
    color:var(--navy-950);font-weight:800;font-size:12px;
}
.user-chip span{
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    max-width:80px;
}
.user-chip button{
    background:none;border:none;color:rgba(255,255,255,.6);
    cursor:pointer;font-size:14px;padding:0 4px;
    flex-shrink:0;
}
.user-chip button:hover{color:var(--gold);}

@media (max-width: 820px){
    .top-badge{display:none;}
}

@media (max-width: 640px){
    .top-header{
        height:60px;
        padding:0 12px;
        gap:8px;
    }
    .hw-logo svg{width:30px;height:36px;}
    .hw-logo-text{font-size:14px;letter-spacing:.8px;}

    .model-selector{
        font-size:11px;
        padding:5px 8px;
        max-width:80px;
    }

    .user-chip{
        padding:3px 8px 3px 3px;
        max-width:120px;
    }
    .user-chip img,
    .user-chip .user-avatar{
        width:24px;height:24px;
    }
    .user-chip span{max-width:50px;font-size:11px;}

    .main-container{
        padding:72px 10px 10px;
    }

    .chat-messages-container{
        gap:10px;
        padding:4px;
    }

    .welcome-center{padding:10px;}
    h1{font-size:28px;margin-bottom:10px;}
    .welcome-sub{font-size:14px;line-height:1.7;}

    .input-box-wrapper{
        padding:6px 8px;
        border-radius:22px;
        gap:6px;
    }
    .input-main-row{gap:6px;}

    .input-box-wrapper input[type="text"]{
        font-size:14px;
        padding:8px 2px;
    }

    .action-icon-btn{
        padding:8px;
        min-width:38px;min-height:38px;
    }
    .action-icon-btn svg{width:18px;height:18px;}

    .chat-bubble{
        max-width:88%;
        padding:10px 14px;
        font-size:14px;
        line-height:1.7;
    }

    .login-card{
        padding:32px 22px;
        border-radius:20px;
    }
    .login-logo{width:60px;height:70px;margin-bottom:12px;}
    .login-title{font-size:19px;}
    .login-sub{font-size:12px;margin-bottom:22px;}
    .google-btn{
        padding:13px 16px;
        font-size:14px;
        border-radius:12px;
    }
    .login-note{font-size:10px;}
}

@media (max-width: 380px){
    .hw-logo-text{font-size:13px;}
    h1{font-size:22px;}
    .model-selector{display:none;}
    .top-header{padding:0 10px;}
    .input-box-wrapper input[type="text"]::placeholder{font-size:13px;}
    .chat-bubble{max-width:92%;}
}

@media (max-height: 500px) and (orientation: landscape){
    .top-header{height:52px;}
    .main-container{padding:60px 12px 8px;}
    .welcome-center h1{font-size:24px;margin-bottom:6px;}
    .welcome-sub{font-size:12px;}
    .chat-messages-container{gap:8px;}
    .input-box-wrapper{padding:5px 8px;}
    .login-card{padding:22px 20px;}
    .login-logo{width:48px;height:56px;margin-bottom:8px;}
    .login-title{font-size:17px;}
    .login-sub{margin-bottom:16px;font-size:11px;}
    .login-note{margin-top:14px;}
}

@supports (padding: max(0px)) {
    .main-container{
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
        padding-bottom: max(16px, env(safe-area-inset-bottom));
    }
    .top-header{
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
    }
}
</style>
</head>
<body>

<!-- ═══ شاشة تسجيل الدخول ═══ -->

        <div class="login-title">ALHWARY AI</div>
        <div class="login-sub">سجل دخولك لحفظ محادثاتك بشكل آمن ومشفر</div>

        <button class="google-btn" id="google-login-btn">
            <svg viewBox="0 0 48 48">

                <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>

<!-- ═══ الشريط العلوي ═══ -->

<div class="main-container">

                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">

<!-- ═══════════════════════════════════════════════════════════════
     ⚙️ إعدادات العقل — URLs كاملة للموقع الأصلي
     ═══════════════════════════════════════════════════════════════ -->
<script>
    /* ✅ روابط كاملة للموقع الأصلي (InfinityFree) */
    window.HAWARY_BACKEND   = 'https://alhwary.wuaze.com/robot';
    window.HAWARY_BRAIN_URL = 'https://alhwary.wuaze.com/robot/firebase-api.php';
    window.HAWARY_WEB_URL   = 'https://alhwary.wuaze.com/robot/web-api.php';
    window.HAWARY_VOICE_URL = 'talking-robot.html';
    window.HAWARY_CHAT_ONLY = true;

    /* Session ID */
    window.HAWARY_SESSION_ID = 'sess_' + (
        localStorage.getItem('hawary_sid') ||
        (function(){
            var s = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
            localStorage.setItem('hawary_sid', s);
            return s;
        })()
    );

    /* بيانات المستخدم (لو موجودة) */
    try {
        var _u = JSON.parse(localStorage.getItem('hawary_user') || 'null');
        if (_u) window.HAWARY_USER = _u;
    } catch(e) {
        window.HAWARY_USER = null;
    }

    console.log('[Alhwary AI] HAWARY_BRAIN_URL:', window.HAWARY_BRAIN_URL);
    console.log('[Alhwary AI] HAWARY_VOICE_URL:', window.HAWARY_VOICE_URL);
</script>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import {
    getAuth, GoogleAuthProvider, signInWithPopup,
    onAuthStateChanged, signOut, setPersistence, browserLocalPersistence
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import {
    getDatabase, ref, set, serverTimestamp
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const firebaseConfig = {
    apiKey: "AIzaSyCtf2ltWCvw6uW8LqpC2BCXKMoc76KjXVU",
    authDomain: "faceb-bb002.firebaseapp.com",
    databaseURL: "https://faceb-bb002-default-rtdb.firebaseio.com",
    projectId: "faceb-bb002",
    storageBucket: "faceb-bb002.firebasestorage.app",
    messagingSenderId: "456482622109",
    appId: "1:456482622109:web:32a45c12e5f1b2a210e274",
    measurementId: "G-5Y46BEF6V1"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getDatabase(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: 'select_account' });

setPersistence(auth, browserLocalPersistence).catch(function(){});

const overlay     = document.getElementById('login-overlay');
const googleBtn   = document.getElementById('google-login-btn');
const userChip    = document.getElementById('user-chip');
const userAvatarImg = document.getElementById('user-avatar-img');
const userAvatarTxt = document.getElementById('user-avatar-txt');
const userNameTxt   = document.getElementById('user-name-txt');
const logoutBtn     = document.getElementById('logout-btn');

googleBtn.addEventListener('click', async function() {
    try {
        googleBtn.disabled = true;
        googleBtn.style.opacity = '.6';
        await signInWithPopup(auth, provider);
    } catch (e) {
        console.error('[Auth]', e);
        alert('تعذّر تسجيل الدخول: ' + (e.message || e.code));
    } finally {
        googleBtn.disabled = false;
        googleBtn.style.opacity = '1';
    }
});

onAuthStateChanged(auth, async function(user) {
    if (user) {
        try {
            await set(ref(db, 'users/' + user.uid), {
                uid: user.uid,
                name: user.displayName || '',
                email: user.email || '',
                photo: user.photoURL || '',
                provider: 'google',
                lastLogin: serverTimestamp(),
                userAgent: navigator.userAgent
            });
            console.log('✅ تم حفظ المستخدم');
        } catch (e) {
            console.warn('⚠️ فشل الحفظ:', e);
        }

        overlay.classList.add('hidden');

        const name  = user.displayName || (user.email ? user.email.split('@')[0] : 'مستخدم');
        const parts = name.trim().split(' ');
        const initials = (parts[0] ? parts[0][0] : '?') + (parts[1] ? parts[1][0] : '');

        if (user.photoURL) {
            userAvatarImg.src = user.photoURL;
            userAvatarImg.style.display = 'block';
            userAvatarTxt.style.display = 'none';
        } else {
            userAvatarTxt.textContent = initials;
            userAvatarTxt.style.display = 'flex';
            userAvatarImg.style.display = 'none';
        }
        userNameTxt.textContent = name;
        userChip.style.display = 'flex';

        window.HAWARY_USER = {
            uid: user.uid,
            name: user.displayName || '',
            email: user.email || '',
            photo: user.photoURL || ''
        };

        try {
            localStorage.setItem('hawary_user', JSON.stringify(window.HAWARY_USER));
        } catch(e) {}

        if (!window.__hawaryHandlerLoaded) {
            window.__hawaryHandlerLoaded = true;
            const s = document.createElement('script');
            s.src = 'hawary-handler.js?v=32.0';
            s.defer = true;
            document.body.appendChild(s);
        }
    } else {
        overlay.classList.remove('hidden');
        userChip.style.display = 'none';
        window.HAWARY_USER = null;
        try { localStorage.removeItem('hawary_user'); } catch(e) {}
    }
});

logoutBtn.addEventListener('click', async function() {
    if (confirm('هل تريد تسجيل الخروج؟')) {
        try { localStorage.removeItem('hawary_user'); } catch(e) {}
        await signOut(auth);
        location.reload();
    }
});
</script>
