<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الروبوت الناطق - مكتب الهواري</title>
    <link rel="manifest" href="manifest.json">

    <style>
        /* ═══════════════════════════════════════════════════════════
         * 🎨 ثيم توفيق: كحلي + ذهبي + أخضر زمردي
         * ═══════════════════════════════════════════════════════════ */
        :root {
            --navy-950: #0b1726;
            --navy-900: #102238;
            --navy-800: #17314a;
            --navy-700: #1e3a5f;
            --gold: #c9a45c;
            --gold-light: #e0c27a;
            --gold-soft: #f4ead3;
            --green: #1f5b4b;
            --green-dark: #16483b;
            --green-light: #63b99a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at 12% 8%, rgba(201,164,92,.14), transparent 28%),
                radial-gradient(circle at 88% 18%, rgba(31,91,75,.12), transparent 30%),
                radial-gradient(circle at 50% 90%, rgba(201,164,92,.08), transparent 40%),
                linear-gradient(135deg, #0b1726 0%, #102238 50%, #0b1726 100%);
            position: relative;
        }

        /* نقاط ضوء زخرفية */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(201,164,92,.08) 0%, transparent 25%),
                radial-gradient(circle at 80% 70%, rgba(99,185,154,.06) 0%, transparent 25%);
            pointer-events: none;
            z-index: 0;
        }

        /* ═══ زر الرئيسية ═══ */
        .back {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 100000;
            background: linear-gradient(135deg, rgba(23,49,74,.9), rgba(16,34,56,.9));
            color: var(--gold-light);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 22px;
            font-size: 14px;
            font-weight: 700;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(201,164,92,.35);
            box-shadow: 0 4px 16px rgba(0,0,0,.3);
            transition: all .3s ease;
        }
        .back:hover {
            background: linear-gradient(135deg, var(--navy-800), var(--navy-700));
            border-color: var(--gold);
            color: var(--gold);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(201,164,92,.25);
        }

        /* ═══ إطار زخرفي للصفحة ═══ */
        .frame-decoration {
            position: fixed;
            inset: 20px;
            border: 1px solid rgba(201,164,92,.15);
            border-radius: 24px;
            pointer-events: none;
            z-index: 1;
        }
        .frame-decoration::before,
        .frame-decoration::after {
            content: '';
            position: absolute;
            width: 60px;
            height: 60px;
            border: 2px solid rgba(201,164,92,.3);
        }
        .frame-decoration::before {
            top: -2px;
            right: -2px;
            border-left: none;
            border-bottom: none;
            border-top-right-radius: 22px;
        }
        .frame-decoration::after {
            bottom: -2px;
            left: -2px;
            border-right: none;
            border-top: none;
            border-bottom-left-radius: 22px;
        }

        /* ═══ شارة حالة مكتبة القرآن ═══ */
        #hw-status {
            position: fixed;
            top: 70px;
            right: 16px;
            z-index: 100000;
            font: 12px Tahoma, sans-serif;
            padding: 6px 14px;
            border-radius: 14px;
            color: #fff;
            background: linear-gradient(135deg, var(--navy-800), var(--navy-900));
            border: 1px solid rgba(201,164,92,.3);
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0,0,0,.3);
            transition: all .3s ease;
            font-weight: 600;
        }
        #hw-status:hover {
            border-color: var(--gold);
            transform: translateY(-1px);
        }

        /* ═══════════════════════════════════════════════════════════
         * 🤖 الروبوت — وسط الصفحة
         * ═══════════════════════════════════════════════════════════ */
        #hawary-robot-box {
            top: 46% !important;
            left: 50% !important;
            right: auto !important;
            bottom: auto !important;
            transform: translate(-50%, -50%);
            z-index: 100;
        }

        #hawary-robot-box .hw-avatar-wrap,
        #hawary-robot-box .hw-avatar-img {
            width: min(64vw, 300px) !important;
            height: min(64vw, 300px) !important;
        }

        #hawary-robot-box .hw-avatar-img {
            border: 4px solid var(--gold) !important;
            box-shadow:
                0 0 0 4px rgba(201,164,92,.15),
                0 0 30px rgba(201,164,92,.35),
                0 0 60px rgba(31,91,75,.25),
                0 20px 50px rgba(0,0,0,.5) !important;
            transition: all .5s ease;
        }

        #hawary-robot-box.speaking .hw-avatar-img {
            border-color: var(--gold-light) !important;
            box-shadow:
                0 0 0 6px rgba(224,194,122,.25),
                0 0 40px rgba(224,194,122,.55),
                0 0 80px rgba(201,164,92,.4),
                0 20px 50px rgba(0,0,0,.5) !important;
        }

        #hawary-robot-box.listening .hw-avatar-img {
            border-color: var(--green-light) !important;
            box-shadow:
                0 0 0 6px rgba(99,185,154,.25),
                0 0 40px rgba(99,185,154,.5),
                0 0 80px rgba(31,91,75,.4),
                0 20px 50px rgba(0,0,0,.5) !important;
        }

        #hawary-robot-box .hw-halo {
            inset: -12px !important;
            border: 1px solid rgba(201,164,92,.2);
        }

        #hawary-bubble {
            position: absolute !important;
            top: calc(100% + 30px) !important;
            bottom: auto !important;
            right: 50% !important;
            transform: translateX(50%);
            width: min(86vw, 460px);
            max-width: none !important;
            text-align: center;
            font-size: 17px !important;
            line-height: 1.9 !important;
            padding: 18px 24px !important;
            background: linear-gradient(135deg, rgba(23,49,74,.95), rgba(16,34,56,.95)) !important;
            backdrop-filter: blur(15px) !important;
            color: var(--gold-soft) !important;
            border: 1px solid rgba(201,164,92,.35) !important;
            border-top: 3px solid var(--gold) !important;
            border-right: none !important;
            border-radius: 18px !important;
            box-shadow:
                0 8px 32px rgba(0,0,0,.4),
                0 0 0 1px rgba(201,164,92,.1),
                inset 0 1px 0 rgba(255,255,255,.05) !important;
            font-weight: 500 !important;
        }

        #hawary-bubble::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 18px;
            height: 18px;
            background: linear-gradient(135deg, rgba(23,49,74,.95), rgba(16,34,56,.95));
            border-left: 1px solid rgba(201,164,92,.35);
            border-top: 1px solid rgba(201,164,92,.35);
            border-top-left-radius: 3px;
        }

        #hawary-lang-badge {
            background: linear-gradient(135deg, var(--gold), var(--gold-light)) !important;
            color: var(--navy-950) !important;
            border: 2px solid rgba(255,255,255,.2) !important;
            box-shadow:
                0 4px 12px rgba(201,164,92,.4),
                0 0 0 3px rgba(11,23,38,.7) !important;
            font-weight: 800 !important;
        }

        #hawary-speech-btn {
            background: linear-gradient(135deg, var(--green), var(--green-light)) !important;
            border: 2px solid var(--gold) !important;
            box-shadow:
                0 4px 16px rgba(31,91,75,.5),
                0 0 0 3px rgba(11,23,38,.5) !important;
            color: #fff !important;
        }
        #hawary-speech-btn:hover {
            background: linear-gradient(135deg, var(--green-light), var(--green)) !important;
            box-shadow:
                0 6px 20px rgba(99,185,154,.7),
                0 0 0 3px rgba(11,23,38,.5) !important;
        }

        .gold-divider {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(90vw, 500px);
            height: 1px;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(201,164,92,.3) 30%,
                rgba(201,164,92,.6) 50%,
                rgba(201,164,92,.3) 70%,
                transparent 100%);
            z-index: 1;
            opacity: 0.4;
            pointer-events: none;
        }

        .star-decoration {
            position: fixed;
            color: var(--gold);
            opacity: 0.15;
            font-size: 24px;
            pointer-events: none;
            z-index: 1;
            animation: subtleFloat 4s ease-in-out infinite;
        }
        .star-decoration.s1 { top: 15%; left: 10%; animation-delay: 0s; }
        .star-decoration.s2 { top: 25%; right: 12%; animation-delay: 1s; font-size: 18px; }
        .star-decoration.s3 { bottom: 20%; left: 15%; animation-delay: 2s; font-size: 30px; }
        .star-decoration.s4 { bottom: 15%; right: 18%; animation-delay: 1.5s; }

        @keyframes subtleFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.15; }
            50% { transform: translateY(-10px) rotate(180deg); opacity: 0.25; }
        }
    </style>
</head>
<body>
    <!-- زر الرئيسية -->
    <a class="back" href="Assistant.html">→ الرئيسية</a>

    <!-- إطار زخرفي -->
    <div class="frame-decoration"></div>

    <!-- شارة حالة مكتبة القرآن -->
    <div id="hw-status">⏳ بحمّل مكتبة القرآن...</div>

    <!-- زخارف نجمية -->
    <div class="star-decoration s1">✦</div>
    <div class="star-decoration s2">✧</div>
    <div class="star-decoration s3">✦</div>
    <div class="star-decoration s4">✧</div>

    <!-- خط ذهبي زخرفي -->
    <div class="gold-divider"></div>

    <script>
    (function () {
        var el = document.getElementById('hw-status'), tries = 0;
        el.addEventListener('click', function () { el.remove(); });
        var t = setInterval(function () {
            tries++;
            var n = (window.HawaryEngineAudio && window.HawaryEngineAudio.size) ? window.HawaryEngineAudio.size() : 0;
            if (n > 0) {
                el.textContent = '✓ مكتبة القرآن: ' + n + ' | محرك 22.7';
                el.style.background = 'linear-gradient(135deg, #1f5b4b, #16483b)';
                el.style.borderColor = '#c9a45c';
                clearInterval(t);
            } else if (tries > 20) {
                el.textContent = '✗ مكتبة القرآن ما اتحمّلتش';
                el.style.background = 'linear-gradient(135deg, #7a1f1f, #5c1616)';
                el.style.borderColor = '#c9a45c';
                clearInterval(t);
            }
        }, 500);
    })();
    </script>

    <!-- ═══════════════════════════════════════════════════════════
         ⚙️ إعدادات العقل
         ═══════════════════════════════════════════════════════════ -->
    <script>
        window.HAWARY_CHAT_ONLY   = true;
        window.HAWARY_VOICE_URL   = 'talking-robot.html';
        window.HAWARY_BRAIN_URL   = 'firebase-api.php';
        window.HAWARY_WEB_URL     = 'web-api.php';

        window.HAWARY_SESSION_ID  = 'sess_' + (
            localStorage.getItem('hawary_sid') ||
            (function(){
                var s = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
                localStorage.setItem('hawary_sid', s);
                return s;
            })()
        );

        try {
            var _u = JSON.parse(localStorage.getItem('hawary_user') || 'null');
            if (_u) {
                window.HAWARY_USER = _u;
            }
        } catch(e) {
            window.HAWARY_USER = null;
        }

        console.log('[talking-robot] HAWARY_CHAT_ONLY :', window.HAWARY_CHAT_ONLY);
        console.log('[talking-robot] HAWARY_VOICE_URL :', window.HAWARY_VOICE_URL);
        console.log('[talking-robot] HAWARY_BRAIN_URL :', window.HAWARY_BRAIN_URL);
        console.log('[talking-robot] HAWARY_WEB_URL   :', window.HAWARY_WEB_URL);
        console.log('[talking-robot] HAWARY_SESSION_ID:', window.HAWARY_SESSION_ID);
        console.log('[talking-robot] HAWARY_USER      :', window.HAWARY_USER);
    </script>

    <!-- الروبوت الناطق -->
    <script type="module" src="robot-engine.js?v=22.13.1"></script>
</body>
</html>
