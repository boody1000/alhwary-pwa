<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b1726">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="avatar.png">
<link rel="apple-touch-icon" href="avatar.png">
<title>الروبوت الناطق — Alhwary AI</title>
<style>
:root{--navy-950:#0b1726;--navy-900:#102238;--navy-800:#17314a;--gold:#c9a45c;--gold-light:#e0c27a;--gold-soft:#f4ead3;--green:#1f5b4b;--green-dark:#16483b;--green-light:#63b99a;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;}
body{margin:0;color:#fff;font-family:'Segoe UI',Tahoma,sans-serif;background:radial-gradient(circle at 12% 8%,rgba(201,164,92,.14),transparent 28%),radial-gradient(circle at 88% 18%,rgba(31,91,75,.12),transparent 30%),linear-gradient(135deg,#0b1726 0%,#102238 50%,#0b1726 100%);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:20px 16px 30px;min-height:100vh;min-height:100dvh;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 20% 30%,rgba(201,164,92,.08) 0%,transparent 25%);pointer-events:none;z-index:0;}
.back{position:fixed;top:16px;right:16px;z-index:1000;background:linear-gradient(135deg,rgba(23,49,74,.9),rgba(16,34,56,.9));color:var(--gold-light);text-decoration:none;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:700;backdrop-filter:blur(10px);border:1px solid rgba(201,164,92,.35);box-shadow:0 4px 16px rgba(0,0,0,.3);transition:all .25s;}
.back:active{transform:scale(.95)}
.status-badge{position:fixed;top:16px;left:16px;z-index:1000;font-size:11px;font-weight:700;padding:6px 12px;border-radius:14px;background:linear-gradient(135deg,rgba(23,49,74,.9),rgba(16,34,56,.9));color:var(--gold);border:1px solid rgba(201,164,92,.3);backdrop-filter:blur(10px);}
.frame{position:fixed;inset:12px;border:1px solid rgba(201,164,92,.15);border-radius:22px;pointer-events:none;z-index:1;}
.frame::before,.frame::after{content:'';position:absolute;width:50px;height:50px;border:2px solid rgba(201,164,92,.3);}
.frame::before{top:-2px;right:-2px;border-left:none;border-bottom:none;border-top-right-radius:20px;}
.frame::after{bottom:-2px;left:-2px;border-right:none;border-top:none;border-bottom-left-radius:20px;}
.star{position:fixed;color:var(--gold);opacity:.15;font-size:20px;pointer-events:none;z-index:1;animation:fl 4s ease-in-out infinite;}
.star.s1{top:12%;left:8%}.star.s2{top:22%;right:10%;animation-delay:1s;font-size:16px}.star.s3{bottom:20%;left:12%;animation-delay:2s;font-size:26px}.star.s4{bottom:16%;right:14%;animation-delay:1.5s}
@keyframes fl{0%,100%{transform:translateY(0) rotate(0);opacity:.12}50%{transform:translateY(-10px) rotate(180deg);opacity:.22}}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;position:relative;z-index:10;padding-top:40px;}
.avatar-wrap{position:relative;width:min(62vw,260px);height:min(62vw,260px);animation:breathe 3.2s ease-in-out infinite;margin-bottom:26px;}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.avatar-wrap.thinking{animation:think 1s ease-in-out infinite}
@keyframes think{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.08) rotate(3deg)}}
.avatar{position:relative;z-index:2;width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:4px solid var(--gold);box-shadow:0 0 0 4px rgba(201,164,92,.15),0 0 30px rgba(201,164,92,.35),0 0 60px rgba(31,91,75,.25),0 20px 50px rgba(0,0,0,.5);transition:all .5s ease;}
.halo{position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(201,164,92,.2);z-index:1;pointer-events:none;}
.speaking .halo{animation:talkGlow .45s ease-in-out infinite alternate;}
@keyframes talkGlow{0%{box-shadow:0 0 0 2px rgba(255,204,0,.65)}100%{box-shadow:0 0 0 14px rgba(255,204,0,0)}}
.listening .halo{animation:listenGlow 1.5s ease-in-out infinite;}
@keyframes listenGlow{0%,100%{box-shadow:0 0 0 4px rgba(46,204,113,.55)}50%{box-shadow:0 0 0 10px rgba(46,204,113,.18)}}
.thinking .avatar{border-color:#ff9800}
.lang-badge{position:absolute;top:-4px;left:-4px;background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--navy-950);font-size:11px;font-weight:800;padding:4px 10px;border-radius:12px;box-shadow:0 4px 12px rgba(201,164,92,.4);z-index:5;}
.bubble{display:none;width:100%;max-width:420px;padding:18px 22px;border-radius:18px;background:linear-gradient(135deg,rgba(23,49,74,.95),rgba(16,34,56,.95));backdrop-filter:blur(15px);color:var(--gold-soft);border:1px solid rgba(201,164,92,.35);border-top:3px solid var(--gold);box-shadow:0 8px 32px rgba(0,0,0,.4);font-size:15px;line-height:1.9;text-align:center;font-weight:500;max-height:38vh;overflow-y:auto;margin-top:6px;}
.bubble.show{display:block;animation:fi .3s ease-out}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.controls{display:flex;gap:14px;align-items:center;justify-content:center;width:100%;max-width:420px;position:relative;z-index:20;padding-bottom:6px;}
.ctrl-btn{width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;transition:all .2s;padding:0;backdrop-filter:blur(8px);position:relative;z-index:21;}
.ctrl-btn:active{transform:scale(.9)}
.ctrl-btn.mic{width:72px;height:72px;font-size:26px;background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;border:2px solid var(--green-light);box-shadow:0 6px 24px rgba(31,91,75,.5);}
.ctrl-btn.mic.rec{background:linear-gradient(135deg,#f85149,#a02a25);border-color:#fff;animation:recP 1.2s infinite;}
@keyframes recP{0%,100%{box-shadow:0 0 0 0 rgba(248,81,73,.6)}50%{box-shadow:0 0 0 18px rgba(248,81,73,0)}}
.ctrl-btn.secondary{background:linear-gradient(135deg,rgba(23,49,74,.9),rgba(16,34,56,.9));color:var(--gold);border:1px solid rgba(201,164,92,.35);}
@media (max-width:640px){
    .back{padding:8px 14px;font-size:12px;}
    .status-badge{font-size:10px;padding:5px 10px;}
    .avatar-wrap{width:min(70vw,240px);height:min(70vw,240px);}
    .bubble{font-size:14px;padding:16px 18px;max-width:340px;}
    .ctrl-btn{width:50px;height:50px;font-size:20px;}
    .ctrl-btn.mic{width:64px;height:64px;font-size:24px;}
}
</style>
</head>
<body>

<a class="back" href="index.html">→ الشات</a>
<div class="status-badge" id="statusBadge">💤 خامل</div>

<div class="frame"></div>
<div class="star s1">✦</div>
<div class="star s2">✧</div>
<div class="star s3">✦</div>
<div class="star s4">✧</div>

<div class="center">
    <div class="avatar-wrap" id="avatarWrap">
        <div class="halo"></div>
        <span class="lang-badge" id="langBadge">AR</span>
        <img class="avatar" id="avatarImg" src="avatar.png" alt="Alhwary AI">
    </div>
    <div class="bubble" id="bubble"></div>
</div>

<div class="controls">
    <button class="ctrl-btn secondary" id="btnTts" title="الصوت">🔊</button>
    <button class="ctrl-btn mic" id="btnMic" title="تكلم">🎤</button>
    <button class="ctrl-btn secondary" id="btnStop" title="إيقاف">⏹️</button>
</div>

<!-- ═══════════════════════════════════════════════════════════════
     ⚙️ إعدادات العقل — لازم قبل robot-engine.js
     ═══════════════════════════════════════════════════════════════ -->
<script>
    window.HAWARY_BACKEND   = 'https://alhwary.wuaze.com/robot';
    window.HAWARY_BRAIN_URL = 'https://alhwary.wuaze.com/robot/firebase-api.php';
    window.HAWARY_WEB_URL   = 'https://alhwary.wuaze.com/robot/web-api.php';
    window.HAWARY_VOICE_URL = 'talking-robot.html';
    window.HAWARY_CHAT_ONLY = false;

    window.HAWARY_SESSION_ID = 'sess_' + (
        localStorage.getItem('hawary_sid') ||
        (function(){
            var s = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
            localStorage.setItem('hawary_sid', s);
            return s;
        })()
    );

    try {
        var _u = JSON.parse(localStorage.getItem('hawary_user') || 'null');
        if (_u) window.HAWARY_USER = _u;
    } catch(e) {
        window.HAWARY_USER = null;
    }

    console.log('[talking-robot] BACKEND:', window.HAWARY_BACKEND);
    console.log('[talking-robot] BRAIN_URL:', window.HAWARY_BRAIN_URL);
</script>

<!-- ═══════════════════════════════════════════════════════════════
     🤖 محرك الروبوت — type="module" إجباري!
     ═══════════════════════════════════════════════════════════════ -->
<script type="module" src="robot-engine.js?v=22.14.0"></script>

<!-- ═══════════════════════════════════════════════════════════════
     🔗 ربط الأزرار
     ═══════════════════════════════════════════════════════════════ -->
<script>
(function() {
    function bindButtons() {
        if (!window.HawaryEngine) {
            setTimeout(bindButtons, 200);
            return;
        }

        console.log('[robot-html] ✅ HawaryEngine found, binding buttons...');

        var btnMic = document.getElementById('btnMic');
        var btnTts = document.getElementById('btnTts');
        var btnStop = document.getElementById('btnStop');
        var statusBadge = document.getElementById('statusBadge');
        var langBadge = document.getElementById('langBadge');
        var avatarWrap = document.getElementById('avatarWrap');
        var bubble = document.getElementById('bubble');

        if (btnMic) {
            btnMic.addEventListener('click', function(e) {
                e.preventDefault(); e.stopPropagation();
                try {
                    if (window.HawaryEngine.listen.isActive()) {
                        window.HawaryEngine.listen.stop();
                        btnMic.classList.remove('rec');
                        if (statusBadge) statusBadge.textContent = '💤 خامل';
                    } else {
                        window.HawaryEngine.listen.start();
                        btnMic.classList.add('rec');
                        if (statusBadge) statusBadge.textContent = '🎤 يسمعك';
                    }
                } catch(err) { console.warn('[robot-html] mic error:', err); }
            });
        }

        if (btnTts) {
            btnTts.addEventListener('click', function(e) {
                e.preventDefault(); e.stopPropagation();
                try {
                    if (window.HawaryEngine.tts.isEnabled()) {
                        window.HawaryEngine.tts.disable();
                        btnTts.textContent = '🔇';
                        btnTts.style.opacity = '0.5';
                    } else {
                        window.HawaryEngine.tts.enable();
                        btnTts.textContent = '🔊';
                        btnTts.style.opacity = '1';
                    }
                } catch(err) {}
            });
        }

        if (btnStop) {
            btnStop.addEventListener('click', function(e) {
                e.preventDefault(); e.stopPropagation();
                try {
                    window.HawaryEngine.health.fix();
                    if (btnMic) btnMic.classList.remove('rec');
                    if (statusBadge) statusBadge.textContent = '💤 خامل';
                } catch(err) {}
            });
        }

        window.addEventListener('hawary:user-spoke', function(e) {
            if (bubble) { bubble.textContent = 'أنت: ' + e.detail.text; bubble.classList.add('show'); }
            if (statusBadge) statusBadge.textContent = '🧠 يفكر';
            if (avatarWrap) avatarWrap.classList.add('thinking');
        });

        window.addEventListener('hawary:bot-replied', function(e) {
            if (bubble) { bubble.textContent = e.detail.reply; bubble.classList.add('show'); }
            if (statusBadge) statusBadge.textContent = '💬 يرد';
            if (avatarWrap) avatarWrap.classList.remove('thinking');
        });

        window.addEventListener('hawary:audio-play', function() {
            if (statusBadge) statusBadge.textContent = '🔊 يتكلم';
            if (avatarWrap) { avatarWrap.classList.add('speaking'); avatarWrap.classList.remove('listening'); }
        });

        window.addEventListener('hawary:audio-ended', function() {
            if (statusBadge) statusBadge.textContent = '💤 خامل';
            if (avatarWrap) avatarWrap.classList.remove('speaking');
        });

        setTimeout(function() {
            var inlineRobot = document.getElementById('hawary-robot-box');
            if (inlineRobot) inlineRobot.style.display = 'none';
        }, 500);

        if (langBadge) langBadge.textContent = window.HawaryEngine.getLang().split('-')[0].toUpperCase();
        if (btnTts) btnTts.textContent = window.HawaryEngine.tts.isEnabled() ? '🔊' : '🔇';

        console.log('[robot-html] ✅ Buttons bound, ready');
    }

    bindButtons();
    window.addEventListener('load', function() { setTimeout(bindButtons, 500); });
})();
</script>

<!-- Service Worker -->
<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js')
            .then(function(r) { console.log('%c[PWA Robot] ✅ SW', 'color:#4caf50;font-weight:bold'); })
            .catch(function(e) { console.warn('[PWA Robot] ❌ SW:', e.message); });
    });
}
</script>

</body>
</html>
